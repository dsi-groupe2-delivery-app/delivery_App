name: Deploy front end to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5

      - name: Build Angular
        working-directory: ./frontend
        run: |
          npm ci
          # Le site est servi sous /<nom du dépôt>/ sur GitHub Pages
          npx ng build --base-href "/${{ github.event.repository.name }}/"
          # Routes Angular (/connexion, /mon-espace…) : GitHub Pages renvoie 404.html
          # pour une URL inconnue, qui recharge alors l'application.
          cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist/frontend/browser
      - id: deployment
        uses: actions/deploy-pages@v4